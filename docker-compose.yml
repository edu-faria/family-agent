services:
  family-agent:
    build: .
    image: family-agent:latest
    container_name: family-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - familydata:/data
    # No ports: the bot uses Telegram long polling.
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('/data/family.db').exists() else 1)"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    image: alpine:3.20
    container_name: family-agent-backup
    restart: unless-stopped
    depends_on: [family-agent]
    env_file: .env
    volumes:
      - familydata:/data
      - ./scripts/backup.sh:/backup.sh:ro
    # Nightly consistent snapshot via `sqlite3 .backup`, retention handled in the script.
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite tzdata >/dev/null && \
      while true; do /bin/sh /backup.sh; sleep 86400; done"]

volumes:
  familydata:
